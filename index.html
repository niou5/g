<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soundboard</title>
<style>
  body {
    background-color: #0a0a0a;
    color: #e0e0e0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    min-height: 100vh;
  }

  h1 {
    color: #4da6ff;
    margin-bottom: 30px;
  }

  .sound-button {
    display: block;
    width: 250px;
    margin: 15px auto;
    padding: 15px;
    background-color: #111827;
    border: 2px solid #1e40af;
    border-radius: 12px;
    color: #e0e0e0;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
  }

  .sound-button:hover {
    background-color: #1e3a8a;
    color: #ffffff;
    transform: scale(1.05);
  }

  .sound-button:active {
    transform: scale(0.95);
  }

  .copy-message {
    margin-top: 20px;
    color: #22c55e;
    font-size: 16px;
    display: none;
  }

  @media (max-width: 768px) {
    .sound-button {
      width: 90%;
    }
  }
</style>
</head>
<body>

<h1>🎵 Soundboard</h1>

<button class="sound-button" onclick="copyLink('Fortnite.m4a')">Fortnite</button>
<button class="sound-button" onclick="copyLink('victory-royale.m4a')">Victory Royale</button>
<button class="sound-button" onclick="copyLink('gta-v-death-sound-effect-102.m4a')">GTA V Death</button>

<p class="copy-message" id="copyMessage"></p>

<script>
function copyLink(filename) {
  const link = `https://niou5.github.io/g/${filename}`;
  navigator.clipboard.writeText(link).then(() => {
    const msg = document.getElementById("copyMessage");
    msg.textContent = `Link for ${filename} copied to clipboard!`;
    msg.style.display = "block";
    setTimeout(() => msg.style.display = "none", 3000);
  });
}
</script>

</body>
</html>
