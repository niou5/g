  <style>
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(to bottom right, #0d0d0d, #111a22);
      color: #e0e0e0;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #00aaff;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 20px;
      color: #b0b0b0;
    }

    .hero a {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1rem;
      color: #00aaff;
      border: 2px solid #00aaff;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .hero a:hover {
      background: #00aaff;
      color: #111;
    }
  </style>
</head>
